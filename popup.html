<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <nav class="tabs">
    <span id="nav-title" class="nav-title" hidden>Settings</span>
    <select id="domain-select" class="domain-select" aria-label="Site"></select>
    <span id="domain-empty" class="tabs-empty" hidden>No site configured</span>
    <button id="settings-toggle" class="icon-btn" title="Settings" aria-label="Settings">&#9881;</button>
    <button id="panel-close" class="icon-btn" title="Close panel" aria-label="Close panel">&#10005;</button>
  </nav>

  <div class="content">
    <section id="settings" class="box" hidden>
      <label for="domain-input">Site domains</label>
      <ul id="domain-chips" class="chips"></ul>
      <div class="domain-entry">
        <input type="text" id="domain-input" placeholder="intranet.example.com"
               spellcheck="false" autocapitalize="off" />
        <button type="button" id="use-current" class="btn">This site</button>
      </div>
      <div id="detected" class="detected" hidden
           title="This site showed a credential prompt, but it isn't in your domain list, so the extension ignored it. Add it to manage users there.">
        <div class="label">Prompted for a password, not managed here</div>
        <div class="detected-row">
          <span id="detected-host"></span>
          <button type="button" id="detected-add" class="btn">Add</button>
        </div>
      </div>

      <label class="check"
             title="Attaches an Authorization: Basic header to every request. Basic auth only — an unsolicited header breaks the NTLM/Negotiate handshake and login will fail.">
        <input type="checkbox" id="preemptive" />
        <span class="toggle" aria-hidden="true"></span>
        <span>Pre-emptive credentials</span>
        <span class="hint">Basic only</span>
      </label>

      <p id="scheme-note" class="msg" hidden></p>

      <div class="label sub-head">Backup</div>
      <div class="form-actions">
        <button type="button" id="export-btn" class="btn">Export…</button>
        <button type="button" id="import-btn" class="btn">Import…</button>
      </div>
      <input type="file" id="import-file" accept=".json,application/json" hidden />

      <form id="export-form" class="sub-form" hidden>
        <div class="pw">
          <input type="password" id="export-pass"
                 placeholder="Passphrase — blank means no encryption" />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Download</button>
          <button type="button" id="export-cancel" class="btn">Cancel</button>
        </div>
      </form>

      <form id="import-form" class="sub-form" hidden>
        <div class="pw">
          <input type="password" id="import-pass" placeholder="Passphrase for this file" />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Import</button>
          <button type="button" id="import-cancel" class="btn">Cancel</button>
        </div>
      </form>

      <p class="hint" id="backup-status">Users and domains only. Passwords are included.</p>
    </section>

    <p id="no-domain" class="msg" hidden>Add your site domain in settings &#9881;</p>

    <section id="active-block" class="active">
      <div class="active-head">
        <span class="label">Signed in as</span>
        <span id="active-badge" class="badge" hidden></span>
        <button type="button" id="active-edit" class="icon-btn" title="Edit this user"
                aria-label="Edit this user" hidden>&#9998;</button>
      </div>
      <div class="active-name" id="active-name">Nobody</div>
      <div class="active-user" id="active-user">Pick a user below</div>
    </section>

    <div class="rack-head" id="rack-head">
      <span class="label" id="rack-label">Switch to</span>
      <input type="search" id="user-search" class="user-search"
             placeholder="Search" aria-label="Search users" spellcheck="false" hidden />
    </div>
    <ul id="sessions" class="rows"></ul>

    <button id="add-toggle" class="btn btn-wide">Add user</button>

    <form id="add-form" class="box" hidden autocomplete="off">
      <div class="label" id="form-title">Add user</div>
      <input type="text" id="name" placeholder="Label, e.g. Approver" required />
      <input type="text" id="username" placeholder="Username or DOMAIN\user" required />
      <!-- The reveal button is added by popup.js so the eye markup lives in one place. -->
      <div class="pw">
        <input type="password" id="password" placeholder="Password" required />
      </div>

      <!-- Only rendered when more than one site is configured: with a single site there is
           nothing to choose and the extra control would be noise. -->
      <div id="domain-choice" class="choice" hidden>
        <div class="label">Sites this user can sign in to</div>
        <button type="button" id="domain-choice-toggle" class="choice-toggle"
                aria-expanded="false" aria-controls="domain-choice-list">
          <span id="domain-choice-summary" class="choice-summary"></span>
          <span class="choice-caret" aria-hidden="true">&#9662;</span>
        </button>
        <ul id="domain-choice-list" class="choice-list" hidden></ul>
      </div>

      <div class="form-actions">
        <button type="submit" id="form-submit" class="btn btn-primary">Save user</button>
        <button type="button" id="add-cancel" class="btn">Cancel</button>
      </div>
    </form>

    <footer id="status-bar" title="Passwords are stored unencrypted in this extension's local storage. QA accounts only."></footer>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
